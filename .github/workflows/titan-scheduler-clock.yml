name: Titan scheduler clock

on:
  schedule:
    # Stay away from the top of the hour, when GitHub reports the most delay.
    # Five-minute traffic keeps Render inside its 15-minute idle window; Titan's
    # own non-overlapping one-minute loop handles minute-level due checks.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-due-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wake Titan and process one due post
        run: |
          OIDC_TOKEN="$(curl --fail-with-body --show-error --silent \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=titan-os-scheduler" \
            | jq --raw-output '.value')"
          test -n "$OIDC_TOKEN"
          test "$OIDC_TOKEN" != "null"
          echo "::add-mask::$OIDC_TOKEN"
          curl --fail-with-body --show-error --silent \
            --connect-timeout 90 \
            --max-time 600 \
            --request POST \
            --header "content-type: application/json" \
            --header "authorization: Bearer $OIDC_TOKEN" \
            --data '{}' \
            https://titanos-dwh6.onrender.com/api/schedule/tick
