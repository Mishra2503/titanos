name: Titan scheduler clock

on:
  schedule:
    # Stay away from the top of the hour, when GitHub reports the most delay.
    # Five-minute traffic keeps Render inside its 15-minute idle window; Titan's
    # own non-overlapping one-minute loop handles minute-level due checks.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-due-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wake Titan and process one due post
        env:
          TITAN_CRON_SECRET: ${{ secrets.TITAN_CRON_SECRET }}
        run: |
          test -n "$TITAN_CRON_SECRET"
          curl --fail-with-body --show-error --silent \
            --connect-timeout 90 \
            --max-time 600 \
            --request POST \
            --header "content-type: application/json" \
            --header "x-cron-secret: $TITAN_CRON_SECRET" \
            --data '{}' \
            https://titanos-dwh6.onrender.com/api/schedule/tick
